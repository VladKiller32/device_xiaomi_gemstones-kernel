name: "Upstream Kernel 5.15 LTS"

on:
  workflow_dispatch:
    inputs:
      upstreamMode:
        description: "Режим обновления до 5.15.225"
        required: true
        type: choice
        default: "safe-version-bump"
        options:
          - "safe-version-bump"
          - "atomic-cherry-pick"

jobs:
  Upstream-Merge:
    name: "⬆️ Merge Latest 5.15 LTS"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: android13-5.15-lts
          fetch-depth: 15

      - name: "🔄 Restore Clean Tree & Bump to Latest 5.15 LTS"
        run: |
          git config user.name "VladKiller32"
          git config user.email "vladkiller32@outlook.com"

          cp -r .github /tmp/github_backup

          # Возвращаемся к нашему 100% рабочему коммиту до частичных патчей (3c6a292d0)
          CLEAN_COMMIT=$(git log --grep="safe upstream Linux" -n 1 --format="%H" || true)
          if [ -n "$CLEAN_COMMIT" ]; then
            echo "⏪ Возвращаем идеально сбалансированное дерево (до рассинхрона заголовков)..."
            git reset --hard "${CLEAN_COMMIT}~1"
            cp -r /tmp/github_backup/* .github/
          fi

          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git fetch --depth=1 stable linux-5.15.y

          NEW_SUB=$(git show FETCH_HEAD:Makefile | awk '/^SUBLEVEL =/ {print $3}')
          echo "🚀 Актуальная версия Linux 5.15 LTS: 5.15.${NEW_SUB}"

          # Обновляем версию в Makefile
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = ${NEW_SUB}/" Makefile

          # Страховка для baseband-guard
          sed -i '/baseband-guard/d' security/Makefile || true
          sed -i '/baseband-guard/d' security/Kconfig || true

          echo "🎉 Новая версия ядра в Makefile:"
          head -n 5 Makefile

          git add -A
          git commit -m "Makefile: bump kernel version to 5.15.${NEW_SUB}" || true
          git push --force origin HEAD:android13-5.15-lts
          echo "✅ Дерево восстановлено и обновлено до 5.15.${NEW_SUB}!"
