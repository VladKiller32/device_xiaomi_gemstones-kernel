name: "Upstream Kernel 5.15 LTS"

on:
  workflow_dispatch:
    inputs:
      upstreamSource:
        description: "Откуда тянуть обновление?"
        required: true
        type: choice
        default: "kernel-org-lts"
        options:
          - "kernel-org-lts"
          - "google-ack-latest"

jobs:
  Upstream-Merge:
    name: "⬆️ Merge Latest 5.15 LTS"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: android13-5.15-lts
          fetch-depth: 1

      - name: "🔄 Apply Latest 5.15 Upstream Cleanly"
        run: |
          git config user.name "VladKiller32"
          git config user.email "vladkiller32@outlook.com"

          CUR_SUB=$(awk '/^SUBLEVEL =/ {print $3}' Makefile)
          echo "📌 Текущая версия в репозитории: 5.15.${CUR_SUB}"

          if [ "${{ github.event.inputs.upstreamSource }}" = "kernel-org-lts" ]; then
            echo "🌐 Проверяем последнюю версию Linux 5.15.y на kernel.org..."
            git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
            git fetch --depth=1 stable refs/tags/v5.15.${CUR_SUB}:refs/tags/v5.15.${CUR_SUB}
            git fetch --depth=1 stable linux-5.15.y

            NEW_SUB=$(git show FETCH_HEAD:Makefile | awk '/^SUBLEVEL =/ {print $3}')
            echo "🚀 Найдена свежая версия на kernel.org: 5.15.${NEW_SUB}"

            if [ "$CUR_SUB" = "$NEW_SUB" ]; then
              echo "✅ У тебя уже стоит самая последняя версия 5.15.${CUR_SUB}!"
              exit 0
            fi

            # Формируем чистый патч между 5.15.189 и свежей 5.15.xxx и накладываем поверх наших файлов без поломки истории Git
            git diff refs/tags/v5.15.${CUR_SUB} FETCH_HEAD > /tmp/upstream.patch
            git apply --3way --ignore-space-change --ignore-whitespace /tmp/upstream.patch || true

            # Если в каких-то кастомных файлах возник конфликт маркеров <<<<<<<, оставляем рабочую версию нашего ядра, кроме Makefile
            git checkout --theirs Makefile 2>/dev/null || true
            git status --porcelain | awk '/^(UU|AA|DU|UD|AU|UA)/ {print $2}' | while read -r file; do
              if [ "$file" != "Makefile" ]; then
                git checkout --ours "$file" 2>/dev/null || true
              fi
              git add "$file" 2>/dev/null || true
            done
          else
            echo "🌐 Проверяем свежую ветку Google ACK..."
            git remote add google https://android.googlesource.com/kernel/common
            LATEST_GOOGLE_BRANCH=$(git ls-remote --heads google "refs/heads/android13-5.15-20*" | awk '{print $2}' | sed 's|refs/heads/||' | sort -V | tail -n 1)
            echo "Найдена последняя ветка Google: $LATEST_GOOGLE_BRANCH"
            git fetch --depth=1 google "$LATEST_GOOGLE_BRANCH"
            git checkout FETCH_HEAD -- Makefile
          fi

          # Страховка: не даём апстриму вернуть удалённый baseband-guard
          sed -i '/baseband-guard/d' security/Makefile || true
          sed -i '/baseband-guard/d' security/Kconfig || true

          echo "🎉 Новая версия ядра после обновления:"
          head -n 5 Makefile

          git add -A
          if ! git diff --cached --quiet; then
            NEW_VER=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' Makefile)
            git commit -m "treewide: upstream Linux to ${NEW_VER}"
            git push origin HEAD:android13-5.15-lts
            echo "✅ Успешно обновлено до ${NEW_VER} и отправлено в репозиторий!"
          else
            echo "ℹ️ Изменений для коммита нет."
          fi
