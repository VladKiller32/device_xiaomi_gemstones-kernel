name: "Build ChicKernel Upgraded (KSU-Next)"

env:
  WORK_DIR: ${{ github.workspace }}

on:
  workflow_dispatch:
    inputs:
      localVersion:
        description: "Имя ядра (localversion)"
        required: false
        default: "-VladKernel32"
      ksuBranch:
        description: "Ветка KernelSU-Next (dev)"
        required: true
        default: "dev"
      cleanRepoSubmodules:
        description: "Удалить старые папки Baseband-guard и KernelSU-Next из самого репозитория?"
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

jobs:
  Build-Kernel:
    name: "🚀 Compile ChicKernel"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      kernelDir: common_gemstones
      kernelName: common
      DEFCONFIG_NAME: chickernel_defconfig

    steps:
      - name: "🧹 Permanently remove old submodules from GitHub repo"
        if: github.event.inputs.cleanRepoSubmodules == 'yes'
        uses: actions/checkout@v4
        with:
          ref: android13-5.15-lts
          fetch-depth: 1

      - name: "🧹 Commit submodule removal to repo"
        if: github.event.inputs.cleanRepoSubmodules == 'yes'
        run: |
          git config user.name "VladKiller32"
          git config user.email "vladkiller32@outlook.com"

          git rm -f --ignore-unmatch Baseband-guard KernelSU-Next .gitmodules
          rm -rf Baseband-guard KernelSU-Next security/baseband-guard drivers/kernelsu

          sed -i '/baseband-guard/d' security/Makefile || true
          sed -i '/baseband-guard/d' security/Kconfig || true
          sed -i 's/,baseband_guard//g' security/Kconfig || true
          sed -i '/CONFIG_BBG/d' arch/arm64/configs/chickernel_defconfig || true

          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true

          if ! git diff --cached --quiet || ! git diff --quiet; then
            git add -A
            git commit -m "treewide: completely remove old Baseband-guard and KernelSU-Next submodules"
            git push origin HEAD:android13-5.15-lts
            echo "✅ Старые папки навсегда удалены из репозитория!"
          else
            echo "ℹ️ Папки уже были удалены ранее."
          fi

      - name: "✨ Setup workspace"
        run: |
          rm -rf * .git* 2>/dev/null || true
          mkdir -p $kernelDir
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 build-essential bc curl flex cpio git zip dwarves libelf-dev gcc-aarch64-linux-gnu libssl-dev python3 clang lld llvm llvm-dev

      - name: "🌟 Clone cleaned ChicKernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --branch android13-5.15-lts \
            https://github.com/VladKiller32/device_xiaomi_gemstones-kernel ${{ env.kernelName }} --depth=1

      - name: "📥 Setup AOSP build environment & Clang r614150"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)
          rm -rf .repo common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r614150.tar.gz "https://github.com/yougotme101/clang/releases/download/v1.0.2/clang-r614150.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r614150
          tar -xzf prebuilts/clang/host/linux-x86/clang-r614150.tar.gz -C prebuilts/clang/host/linux-x86/clang-r614150
          rm -f prebuilts/clang/host/linux-x86/clang-r614150.tar.gz

          sed -i \
            -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r614150/' \
            ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants

          sed -i '/^DEFCONFIG=gki_defconfig/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki

          sed -i \
            -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
            -e '/^TRIM_NONLISTED_KMI=/d' \
            -e '/^KMI_ENFORCED=/d' \
            -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
            -e '$a\TRIM_NONLISTED_KMI=0' \ -e '$a\KMI_ENFORCED=0' \
            -e '/^MODULES_ORDER=/d' \
            -e '/^MODULES_LIST=/d' \
            ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64

      - name: "📐 Setup SWAP 24GB"
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: "🔧 Install fresh KernelSU-Next & tune config"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo 'KBUILD_CFLAGS += -Wno-default-const-init-unsafe -Wno-uninitialized-const-pointer -Wno-implicit-function-declaration -Wno-sometimes-uninitialized' >> Makefile

          # Подстраховка: убираем хвосты baseband-guard и старого KSU
          rm -rf ./Baseband-guard ./security/baseband-guard ./KernelSU ./KernelSU-Next ./drivers/kernelsu
          sed -i '/baseband-guard/d' security/Makefile || true
          sed -i '/baseband-guard/d' security/Kconfig || true
          sed -i 's/,baseband_guard//g' security/Kconfig || true
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true

          # Отключаем старые ручные хуки KSU в файлах ядра (так как новый KSU-Next v3.4.2 использует Kprobes/Tracepoints)
          for f in fs/open.c fs/read_write.c fs/stat.c fs/exec.c drivers/tty/pty.c drivers/input/input.c fs/namespace.c; do
            if [ -f "$f" ]; then
              sed -i 's/#ifdef CONFIG_KSU$/#ifdef CONFIG_KSU_LEGACY_MANUAL_HOOKS_DISABLED/g' "$f"
              sed -i 's/#if defined(CONFIG_KSU)$/#if defined(CONFIG_KSU_LEGACY_MANUAL_HOOKS_DISABLED)/g' "$f"
              sed -i 's/ksu_handle_stat([^;]*;/0;/g' "$f"
              sed -i 's/ksu_handle_sys_read([^;]*;/0;/g' "$f"
              sed -i 's/ksu_handle_vfs_read([^;]*;/0;/g' "$f"
              sed -i 's/ksu_handle_faccessat([^;]*;/0;/g' "$f"
              sed -i 's/ksu_handle_execveat([^;]*;/0;/g' "$f"
              sed -i 's/ksu_handle_execveat_sucompat([^;]*;/0;/g' "$f"
              sed -i 's/ksu_handle_devpts([^;]*;/0;/g' "$f"
              sed -i 's/ksu_handle_input_handle_event([^;]*;/0;/g' "$f"
              sed -i 's/unlikely(ksu_execveat_hook)/0/g' "$f"
              sed -i 's/unlikely(ksu_vfs_read_hook)/0/g' "$f"
              sed -i 's/unlikely(ksu_input_hook)/0/g' "$f"
            fi
          done

          # Устанавливаем свежий KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev/kernel/setup.sh" | bash -s ${{ github.event.inputs.ksuBranch }}
          if [ ! -L "drivers/kernelsu" ]; then
            ln -sf ../KernelSU-Next drivers/kernelsu
          fi

          # Фиксим конфликт символов selinux_hide (с учётом макроса __nocfi на строке 1517)
          HIDE=$(find -L drivers/kernelsu -name selinux_hide.c 2>/dev/null | head -1)
          if [ -n "$HIDE" ] && ! grep -q fake_state "$HIDE"; then
            sed -i -E 's/^static[[:space:]]+(int|void)([[:space:]]+__nocfi)?[[:space:]]+(security_context_to_sid_with_policy|security_sid_to_context_with_policy|security_compute_av_user_with_policy)\(/\1\2 \3(/' "$HIDE"
            FS=security/selinux/selinuxfs.c
            HK=security/selinux/hooks.c
            E1='extern struct selinux_policy *backup_sepolicy;'
            E2='extern int security_context_to_sid_with_policy(struct selinux_policy *policy, const char *scontext, u32 scontext_len, u32 *sid, u32 def_sid, gfp_t gfp_flags, u32 *orig_sid_p, int *orig_rc_p);'
            E3='extern int security_sid_to_context_with_policy(struct selinux_policy *policy, u32 sid, char **scontext, u32 *scontext_len);'
            E4='extern void security_compute_av_user_with_policy(struct selinux_policy *policy, u32 ssid, u32 tsid, u16 tclass, struct av_decision *avd);'
            if [ -f "$FS" ]; then
              sed -i \
                -e "s|^extern struct selinux_state fake_state;|${E1}\n${E2}\n${E3}\n${E4}|" \
                -e 's|security_context_to_sid(&fake_state, buf, size, &sid, GFP_KERNEL)|security_context_to_sid_with_policy(backup_sepolicy, buf, size, \&sid, SECSID_NULL, GFP_KERNEL, NULL, NULL)|' \
                -e 's|security_sid_to_context(&fake_state, sid, &canon, &len)|security_sid_to_context_with_policy(backup_sepolicy, sid, \&canon, \&len)|' \
                -e 's|security_context_str_to_sid(&fake_state, scon, &ssid, GFP_KERNEL)|security_context_to_sid_with_policy(backup_sepolicy, scon, strlen(scon), \&ssid, SECSID_NULL, GFP_KERNEL, NULL, NULL)|' \
                -e 's|security_context_str_to_sid(&fake_state
