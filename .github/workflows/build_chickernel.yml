name: "Build ChicKernel Upgraded (KSU-Next)"

env:
  WORK_DIR: ${{ github.workspace }}

on:
  workflow_dispatch:
    inputs:
      localVersion:
        description: "Имя ядра (localversion)"
        required: false
        default: "-VladKernel32"
      ksuBranch:
        description: "Ветка KernelSU-Next (dev)"
        required: true
        default: "dev"

jobs:
  Build-Kernel:
    name: "🚀 Compile ChicKernel"
    runs-on: ubuntu-latest
    env:
      kernelDir: common_gemstones
      kernelName: common
      DEFCONFIG_NAME: chickernel_defconfig

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p $kernelDir
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 build-essential bc curl flex cpio git zip dwarves libelf-dev gcc-aarch64-linux-gnu libssl-dev python3 clang lld llvm llvm-dev

      - name: "🌟 Clone ChicKernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --branch android13-5.15-lts \
            https://github.com/VladKiller32/device_xiaomi_gemstones-kernel ${{ env.kernelName }} --depth=1

      - name: "📥 Setup AOSP build environment & Clang r614150"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)
          rm -rf .repo common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r614150.tar.gz "https://github.com/yougotme101/clang/releases/download/v1.0.2/clang-r614150.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r614150
          tar -xzf prebuilts/clang/host/linux-x86/clang-r614150.tar.gz -C prebuilts/clang/host/linux-x86/clang-r614150
          rm -f prebuilts/clang/host/linux-x86/clang-r614150.tar.gz

          sed -i \
            -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r614150/' \
            ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants

          sed -i '/^DEFCONFIG=gki_defconfig/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki

          sed -i \
            -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
            -e '/^TRIM_NONLISTED_KMI=/d' \
            -e '/^KMI_ENFORCED=/d' \
            -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
            -e '$a\TRIM_NONLISTED_KMI=0' \
            -e '$a\KMI_ENFORCED=0' \
            -e '/^MODULES_ORDER=/d' \
            -e '/^MODULES_LIST=/d' \
            ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64

      - name: "📐 Setup SWAP 24GB"
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: "🔧 Install fresh KernelSU-Next & Legacy Hooks Bridge"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo 'KBUILD_CFLAGS += -Wno-default-const-init-unsafe -Wno-uninitialized-const-pointer -Wno-implicit-function-declaration -Wno-sometimes-uninitialized' >> Makefile

          # Вычищаем хвосты baseband-guard и старого KSU
          rm -rf ./Baseband-guard ./security/baseband-guard ./KernelSU ./KernelSU-Next ./drivers/kernelsu
          sed -i '/baseband-guard/d' security/Makefile || true
          sed -i '/baseband-guard/d' security/Kconfig || true
          sed -i 's/,baseband_guard//g' security/Kconfig || true
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true

          # Ставим свежий KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev/kernel/setup.sh" | bash -s ${{ github.event.inputs.ksuBranch }}
          if [ ! -L "drivers/kernelsu" ]; then
            ln -sf ../KernelSU-Next drivers/kernelsu
          fi

          # Создаём C-адаптер для старых символов ручных хуков ChicKernel (чтобы не ломать файлы ядра через sed и не было undefined symbol на vmlinux.o)
          cat << 'EOF' > kernel/ksu_legacy_bridge.c
          #include <linux/types.h>
          #include <linux/export.h>

          bool ksu_execveat_hook __read_mostly = false;
          bool ksu_vfs_read_hook __read_mostly = false;
          bool ksu_input_hook __read_mostly = false;

          int __weak ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags) { return 0; }
          int __weak ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr) { return 0; }
          int __weak ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos) { return 0; }
          int __weak ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags) { return 0; }
          int __weak ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }
          int __weak ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }
          int __weak ksu_handle_devpts(struct inode *inode) { return 0; }
          int __weak ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value) { return 0; }
          EOF
          echo "obj-y += ksu_legacy_bridge.o" >> kernel/Makefile

          # Фиксим конфликт символов selinux_hide (с учётом макроса __nocfi)
          HIDE=$(find -L drivers/kernelsu -name selinux_hide.c 2>/dev/null | head -1)
          if [ -n "$HIDE" ] && ! grep -q fake_state "$HIDE"; then
            sed -i -E 's/^static[[:space:]]+(int|void)([[:space:]]+__nocfi)?[[:space:]]+(security_context_to_sid_with_policy|security_sid_to_context_with_policy|security_compute_av_user_with_policy)\(/\1\2 \3(/' "$HIDE"
            FS=security/selinux/selinuxfs.c
            HK=security/selinux/hooks.c
            E1='extern struct selinux_policy *backup_sepolicy;'
            E2='extern int security_context_to_sid_with_policy(struct selinux_policy *policy, const char *scontext, u32 scontext_len, u32 *sid, u32 def_sid, gfp_t gfp_flags, u32 *orig_sid_p, int *orig_rc_p);'
            E3='extern int security_sid_to_context_with_policy(struct selinux_policy *policy, u32 sid, char **scontext, u32 *scontext_len);'
            E4='extern void security_compute_av_user_with_policy(struct selinux_policy *policy, u32 ssid, u32 tsid, u16 tclass, struct av_decision *avd);'
            if [ -f "$FS" ]; then
              sed -i \
                -e "s|^extern struct selinux_state fake_state;|${E1}\n${E2}\n${E3}\n${E4}|" \
                -e 's|security_context_to_sid(&fake_state, buf, size, &sid, GFP_KERNEL)|security_context_to_sid_with_policy(backup_sepolicy, buf, size, \&sid, SECSID_NULL, GFP_KERNEL, NULL, NULL)|' \
                -e 's|security_sid_to_context(&fake_state, sid, &canon, &len)|security_sid_to_context_with_policy(backup_sepolicy, sid, \&canon, \&len)|' \
                -e 's|security_context_str_to_sid(&fake_state, scon, &ssid, GFP_KERNEL)|security_context_to_sid_with_policy(backup_sepolicy, scon, strlen(scon), \&ssid, SECSID_NULL, GFP_KERNEL, NULL, NULL)|' \
                -e 's|security_context_str_to_sid(&fake_state, tcon, &tsid, GFP_KERNEL)|security_context_to_sid_with_policy(backup_sepolicy, tcon, strlen(tcon), \&tsid, SECSID_NULL, GFP_KERNEL, NULL, NULL)|' \
                -e 's|security_compute_av_user(&fake_state, ssid, tsid, tclass, &avd)|security_compute_av_user_with_policy(backup_sepolicy, ssid, tsid, tclass, \&avd)|' \
                "$FS"
            fi
            if [ -f "$HK" ]; then
              sed -i \
                -e "s|^extern struct selinux_state fake_state;|${E1}\n${E2}|" \
                -e 's|security_context_to_sid(&fake_state, value, size, &tmp_sid, GFP_KERNEL)|security_context_to_sid_with_policy(backup_sepolicy, value, size, \&tmp_sid, SECSID_NULL, GFP_KERNEL, NULL, NULL)|' \
                "$HK"
            fi
          fi

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          sed -i '/CONFIG_BBG/d' "$CONFIG_FILE"
          sed -i '/CONFIG_KSU_SUSFS/d' "$CONFIG_FILE"
          echo "# CONFIG_KSU_SUSFS is not set" >> "$CONFIG_FILE"

          sed -i '/CONFIG_LTO_CLANG/d' "$CONFIG_FILE"
          sed -i '/CONFIG_THINLTO/d' "$CONFIG_FILE"
          echo "CONFIG_LTO_CLANG=y" >> "$CONFIG_FILE"
          echo "# CONFIG_LTO_CLANG_FULL is not set" >> "$CONFIG_FILE"
          echo "CONFIG_LTO_CLANG_THIN=y" >> "$CONFIG_FILE"
          echo "CONFIG_THINLTO=y" >> "$CONFIG_FILE"

          sed -i '/^CONFIG_KSU=/d' "$CONFIG_FILE"
          sed -i '/CONFIG_KPROBES/d' "$CONFIG_FILE"
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          echo "CONFIG_KPROBES=y" >> "$CONFIG_FILE"
          echo "CONFIG_HAVE_KPROBES=y" >> "$CONFIG_FILE"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"
          echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"

          if [ -n "${{ github.event.inputs.localVersion }}" ]; then
            sed -i '/^CONFIG_LOCALVERSION=/d' "$CONFIG_FILE"
            echo 'CONFIG_LOCALVERSION="${{ github.event.inputs.localVersion }}"' >> "$CONFIG_FILE"
          fi

      - name: "🔨 Build Kernel (with automatic error extractor)"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -o pipefail
          if ! LTO=thin BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all) 2>&1 | tee build_full.log; then
            echo "===================================================="
            echo "❌ СВОДКА ВСЕХ ОШИБОК КОМПИЛЯЦИИ (НАЙДЕНО АВТОМАТИЧЕСКИ):"
            grep -E "error:|undefined symbol:|FAILED:" build_full.log | tail -n 40
            echo "===================================================="
            exit 1
          fi

      - name: "📦 Package AnyKernel3 ZIP"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          git clone --depth=1 https://github.com/yougotme101/AnyKernel3 -b master AnyKernel3
          cp out/dist/Image AnyKernel3/Image.ksu
          ZIP_NAME="ChicKernel_KSUNext${{ github.event.inputs.localVersion }}_$(date +'%Y-%m-%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "📤 Upload Flashable ZIP"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.WORK_DIR }}/${{ env.ZIP_NAME }}
          retention-days: 5
